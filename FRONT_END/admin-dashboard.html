<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Help Desk - Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="admin-dashboard">
    <nav class="topbar">
        <div class="topbar-left">
            <span class="dashboard-title" id="admin-dashboard-title">Admin Dashboard</span>
        </div>
        <div class="topbar-right">
            <div class="dropdown">
                <button class="dropdown-btn" type="button">☰ Options</button>
                <div class="dropdown-content">
                    <a href="#" id="darkmode-toggle">🌙 Enable Dark Mode</a>
                    <a href="#" id="create-user-link">👤 Create New User</a>
                    <a href="#" id="create-admin-link">🛡️ Create New Admin</a>
                    <a href="admin-login.html">↩️ Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <aside class="registration-panel" id="registration-panel" aria-label="Registration panel">
        <div class="registration-header">
            <h2 id="registration-title">Create New User</h2>
            <button class="close-btn" id="close-registration" type="button" aria-label="Close registration panel">×</button>
        </div>

        <form id="registration-form" class="registration-form">
            <div id="user-registration-fields">
                <div class="form-group">
                    <label for="user-name">User Name</label>
                    <input type="text" id="user-name" name="user-name" placeholder="Enter user name">
                </div>

                <div class="form-group">
                    <label for="employee-code">Employee Code</label>
                    <input type="text" id="employee-code" name="employee-code" placeholder="Enter employee code">
                </div>
            </div>

            <div id="admin-registration-fields" hidden>
                <div class="form-group">
                    <label for="admin-code">Admin Code</label>
                    <input type="text" id="admin-code" name="admin-code" placeholder="Enter admin code">
                </div>
            </div>

            <div class="form-group">
                <label for="registration-password">Password</label>
                <input type="password" id="registration-password" name="registration-password" placeholder="Enter password">
            </div>

            <button type="submit" class="login-btn">Create</button>
        </form>
    </aside>

    <main class="admin-dashboard-page">
        <section class="ticket-list-section admin-ticket-section">
            <div class="ticket-list-card">
                <div class="ticket-list-heading">
                    <h2>All Tickets</h2>
                    <div class="ticket-view-switch" role="group" aria-label="Ticket status filter">
                        <button class="ticket-view-option active" type="button" data-admin-ticket-status="Live">Live Tickets</button>
                        <button class="ticket-view-option" type="button" data-admin-ticket-status="Resolved">Resolved Tickets</button>
                    </div>
                </div>

                <div class="admin-ticket-toolbar">
                    <button class="admin-ticket-operation" type="button">Delete Ticket(s)</button>
                    <button class="admin-ticket-operation" type="button">Change Status</button>
                </div>

                <div id="admin-ticket-list" class="ticket-list admin-ticket-list" data-active-status="Live">
                    <div class="admin-ticket-item" data-ticket-id="1">
                    <input type="checkbox" class="admin-ticket-select">
                    <span>Laptop won't turn on</span>
                    <span>Hardware</span>
                    </div>

                    <div class="admin-ticket-item" data-ticket-id="2">
                        <input type="checkbox" class="admin-ticket-select">
                        <span>Can't access shared drive</span>
                        <span>Network</span>
                    </div>

                    <div class="admin-ticket-item" data-ticket-id="3">
                        <input type="checkbox" class="admin-ticket-select">
                        <span>Outlook keeps crashing</span>
                        <span>Email / Collaboration</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
