<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Help Desk - Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="admin-dashboard">
    <nav class="topbar">
        <div class="topbar-left">
            <span class="dashboard-title" id="admin-dashboard-title">Admin Dashboard</span>
        </div>
        <div class="topbar-right">
            <div class="dropdown">
                <button class="dropdown-btn" type="button">☰ Options</button>
                <div class="dropdown-content">
                    <a href="#" id="darkmode-toggle">🌙 Enable Dark Mode</a>
                    <a href="#" id="create-user-link">👤 Create New User</a>
                    <a href="#" id="create-admin-link">🛡️ Create New Admin</a>
                    <button id="logout-btn">↩️ Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <aside class="registration-panel" id="registration-panel" aria-label="Registration panel">
        <div class="registration-header">
            <h2 id="registration-title">Create New User</h2>
            <button class="close-btn" id="close-registration" type="button" aria-label="Close registration panel">×</button>
        </div>

        <form id="registration-form" class="registration-form">
            <div id="user-registration-fields">
                <div class="form-group">
                    <label for="user-name">User Name</label>
                    <input type="text" id="user-name" name="user-name" placeholder="Max 100 Characters" required>
                    <p class="validation-error" id="user-name-error" hidden>User Name is too long!</p>
                </div>

                <div class="form-group">
                    <label for="employee-code">Employee Code</label>
                    <input type="text" id="employee-code" name="employee-code" placeholder="3-20 Characters" required>
                    <p class="validation-error" id="employee-code-error" hidden>Employee Code must be 3-20 characters!</p>
                </div>
            </div>

            <div id="admin-registration-fields" hidden>
                <div class="form-group">
                    <label for="admin-code">Admin Code</label>
                    <input type="text" id="admin-code" name="admin-code" placeholder="3-20 Characters" required>
                    <p class="validation-error" id="admin-code-error" hidden>Admin Code must be 3-20 characters!</p>
                </div>
            </div>

            <div class="form-group">
                <label for="registration-password">Password</label>
                <input type="password" id="registration-password" name="registration-password" placeholder="Min 8 Characters" required>
                <label for="registration-password-confirm">Confirm Password</label>
                <input type="password" id="registration-password-confirm" name="registration-password-confirm" placeholder="Confirm Password" required>
                <p class="validation-error" id="registration-password-error" hidden>Password must be 8-100 characters!</p>
                <p class="validation-error" id="registration-password-confirm-error" hidden>Passwords do not match!</p>
            </div>

            <button type="submit" class="login-btn">Create</button>
        </form>
    </aside>

    <main class="admin-dashboard-page">
        <section class="ticket-list-section admin-ticket-section">
            <div class="ticket-list-card">
                <div class="ticket-list-heading">
                    <h2>All Tickets</h2>
                    <div class="ticket-view-switch" role="group" aria-label="Ticket status filter">
                        <button class="ticket-view-option active" type="button" data-ticket-status="Live">Live Tickets</button>
                        <button class="ticket-view-option" type="button" data-ticket-status="Resolved">Resolved Tickets</button>
                    </div>
                </div>
                <div id="ticket-list" class="ticket-list admin-ticket-list" data-active-status="Live"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
