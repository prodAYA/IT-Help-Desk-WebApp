<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Help Desk - Ticket</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="ticket-view">
    <nav class="topbar">
        <div class="topbar-left">
            <span class="topbar-title" id="ticket-view-title">Ticket</span>
        </div>
        <div class="topbar-right">
            <div class="dropdown">
                <button class="dropdown-btn" type="button">☰ Options</button>
                <div class="dropdown-content">
                    <a href="#" id="darkmode-toggle">🌙 Enable Dark Mode</a>
                    <a href="login.html">↩️ Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="dashboard-page ticket-view-page">
        <section class="dashboard-card ticket-detail-card">
            <h1>Ticket Details</h1>
            <div id="ticket-details" class="ticket-details"></div>
            <button class="back-to-tickets" id="back-to-tickets">Back to Dashboard</button>
        </section>

        <section class="comment-section">
            <h3>Chat History</h3>
            <div id="comment-list" class="comment-list"></div>

            <form id="comment-form" class="comment-form">
                <textarea id="comment-message" placeholder="Type a message..." required></textarea>
                <button type="submit" class="login-btn">Send</button>
            </form>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
