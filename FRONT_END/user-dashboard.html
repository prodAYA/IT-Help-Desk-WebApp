<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Help Desk - User Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="user-dashboard">
    <nav class="topbar">
        <div class="topbar-left">
            <span class="topbar-title" id="welcome-name">Hello</span>
        </div>
        <div class="topbar-right">
            <button class="notification-btn" id="notification-btn" aria-label="Notifications">🔔 Notifications</button>
            <div class="dropdown">
                <button class="dropdown-btn" type="button">☰ Options</button>
                <div class="dropdown-content">
                    <a href="#" id="darkmode-toggle">🌙 Enable Dark Mode</a>
                    <button id="logout-btn">↩️ Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <aside class="notification-panel" id="notification-panel" aria-label="Notifications sidebar">
        <div class="notification-header">
            <h3>Notifications</h3>
            <button class="close-btn" id="close-notifications" aria-label="Close notifications">×</button>
        </div>

        <div class="notification-tabs">
            <button class="notification-tab active" data-tab="COMMENT" type="button">New Comments</button>
            <button class="notification-tab" data-tab="STATUS" type="button">Ticket Status</button>
        </div>

        <div class="notification-list" id="notification-list"></div>
    </aside>

    <main class="dashboard-page">
        <section class="dashboard-card">
            <div class="ticket-creator-section">
                <button id="toggle-ticket-form" class="ticket-toggle-btn" type="button">Create New Ticket</button>
                <div class="ticket-seam" aria-hidden="true"></div>

                <div id="ticket-form-wrapper" class="ticket-form-wrapper collapsed">
                    <form id="new-ticket-form" class="ticket-form">
                        <div class="form-group">
                            <label for="ticket-category">Category</label>
                            <select id="ticket-category" name="ticket-category" required>
                                <option value="">Select a category</option>
                                <option value="Network">Network</option>
                                <option value="Hardware">Hardware</option>
                                <option value="Software">Software</option>
                                <option value="Account / Access">Account / Access</option>
                                <option value="Email / Collaboration">Email / Collaboration</option>
                                <option value="Security">Security</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="ticket-description">Description</label>
                            <div class="textarea-wrap">
                                <textarea id="ticket-description" name="ticket-description" maxlength="650" rows="6" placeholder="Describe the issue in detail..." required></textarea>
                                <div class="char-counter"><span id="ticket-char-count">0</span>/650</div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="ticket-attachment">Attachment</label>
                            <input id="ticket-attachment" name="ticket-attachment" type="file" accept="image/*">
                        </div>

                        <button type="submit" id="submit-ticket-btn" class="login-btn submit-ticket-btn">Submit</button>
                    </form>
                </div>
            </div>
        </section>
        
    </main>
    
    <section class="ticket-list-section">

    <div class="ticket-list-card">

        <div class="ticket-list-heading">
            <h2>My Tickets</h2>

            <div class="ticket-view-switch" role="group" aria-label="Ticket status filter">
                <button class="ticket-view-option active" type="button" data-ticket-status="Live">Live Tickets</button>
                <button class="ticket-view-option" type="button" data-ticket-status="Resolved">Resolved Tickets</button>
            </div>

        </div>

        <div id="ticket-list" class="ticket-list" data-active-status="Live"></div>
   
    </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
