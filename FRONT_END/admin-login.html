<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Help Desk - Admin Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="topbar">
        <div class="topbar-left">
            <span class="topbar-title">IT Help Desk</span>
        </div>
        <div class="topbar-right">
            <div class="dropdown">
                <button class="dropdown-btn">☰ Options</button>
                <div class="dropdown-content">
                    <a href="#" id="darkmode-toggle">🌙 Enable Dark Mode</a>
                    <a href="login.html">👤 User Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Login Container -->
    <div class="login-container">
        <div class="login-box">
            <h1>Admin Login</h1>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="admin-code">Admin Code</label>
                    <input type="text" id="admin-code" name="admin-code" placeholder="Enter admin code" required>
                </div>

                <div class="form-group">
                    <label for="admin-password">Admin Password</label>
                    <input type="password" id="admin-password" name="admin-password" placeholder="Enter admin password" required>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
