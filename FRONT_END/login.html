<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Help Desk - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="topbar">
        <div class="topbar-left">
            <span class="topbar-title">IT Help Desk</span>
        </div>
        <div class="topbar-right">
            <div class="dropdown">
                <button class="dropdown-btn">☰ Options</button>
                <div class="dropdown-content">
                    <a href="#" id="darkmode-toggle">🌙 Enable Dark Mode</a>
                    <a href="admin-login.html">🔐 Admin Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Login Container -->
    <div class="login-container">
        <div class="login-box">
            <h1>Employee Login</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="employee-code">Employee Code</label>
                    <input type="text" id="employee-code" name="employee-code" placeholder="Enter your employee code" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" id="login-btn" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
